<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HexFence payment review</title></head>
<body><main><h1>HexFence payment review</h1><div id="review" aria-live="polite">Loading request…</div>
<div id="friction" hidden><label for="suffix">To continue, type the last 6 characters of the recipient shown above.</label><input id="suffix" autocomplete="off" spellcheck="false" maxlength="6"></div>
<button id="reject">Reject</button><button id="continue" disabled>Continue to wallet</button>
<p id="status" role="status"></p><p>Review expires after about three minutes. Continuing forwards this request to your wallet.</p>
</main><script type="module" src="/src/review.ts"></script></body></html>

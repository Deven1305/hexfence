name: Contracts and workspace checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
        working-directory: contracts
      - run: npx hardhat test
        working-directory: contracts
      - run: corepack pnpm@10.34.9 install --frozen-lockfile
      # Preserve Vitest globs in existing package scripts (Pay's e2e exclusion
      # is currently unquoted). Do not consume the Playwright suite as Vitest.
      - run: corepack pnpm@10.34.9 -r test
        env:
          npm_config_script_shell: bash
          BASH_ENV: ${{ github.workspace }}/.github/scripts/ci-shell.sh
      - run: corepack pnpm@10.34.9 -r build

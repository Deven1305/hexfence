name: Build and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/explorer/**'
      - 'apps/pay/**'
      - 'apps/site/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pramaan/**'
      - 'integration/**'
      - 'tsconfig*.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'apps/explorer/**'
      - 'apps/pay/**'
      - 'apps/site/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pramaan/**'
      - 'integration/**'
      - 'tsconfig*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Attestation only runs on main; pull requests skip that step.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # Every VITE_* value is public in the browser bundle. Use only public or
      # origin-restricted keys. Never add DEPLOYER_PRIVATE_KEY / ARKIV_PRIVATE_KEY.
      VITE_ARKIV_PUBLISHER: ${{ vars.VITE_ARKIV_PUBLISHER }}
      VITE_GUARD_ADDRESS: ${{ vars.VITE_GUARD_ADDRESS }}
      VITE_SEPOLIA_RPC_URL: ${{ vars.VITE_SEPOLIA_RPC_URL }}
      VITE_MAINNET_RPC_URL: ${{ vars.VITE_MAINNET_RPC_URL }}
      VITE_ARKIV_ACCESS_KEY: ${{ vars.VITE_ARKIV_ACCESS_KEY }}
      VITE_EXPLORER_URL: ${{ vars.VITE_EXPLORER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: |
          corepack pnpm@10.34.9 install --frozen-lockfile
          corepack pnpm@10.34.9 --dir pramaan install --frozen-lockfile
      - name: Test contracts and workspace
        run: |
          npm --prefix contracts install --legacy-peer-deps
          (cd contracts && npx hardhat test)
          corepack pnpm@10.34.9 -r test
          corepack pnpm@10.34.9 -r build
      - name: Require public production configuration
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for name in VITE_ARKIV_PUBLISHER VITE_GUARD_ADDRESS VITE_SEPOLIA_RPC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Set repository variable $name before deploying Pages."
              exit 1
            fi
          done
      - name: Build shared packages
        run: corepack pnpm@10.34.9 --filter @hexfence/shared --filter @hexfence/arkiv build
      - name: Build explorer and Pay with relative asset URLs
        # Relative bases handle /hexfence/explorer/ and /hexfence/pay/, root
        # hosting and custom domains without changing application source.
        run: |
          corepack pnpm@10.34.9 --filter @hexfence/explorer build --base ./
          corepack pnpm@10.34.9 --filter @hexfence/pay build --base ./
          corepack pnpm@10.34.9 --filter @hexfence/site build
      - name: Capture production UI at mobile and desktop in both themes
        run: |
          corepack pnpm@10.34.9 --filter @hexfence/pay exec playwright install --with-deps chromium
          node --require ./contracts/scripts/v2-compiler-support.js apps/pay/e2e/run.mjs
          node apps/pay/e2e/visual.mjs
          node apps/pay/e2e/upgrade-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-visuals
          path: artifacts/xray/
      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p _site/explorer _site/pay
          cp -R apps/explorer/dist/. _site/explorer/
          cp -R apps/pay/dist/. _site/pay/
          touch _site/.nojekyll
          cp -R apps/site/dist/. _site/
      - name: Save published Arkiv records when reads are available
        if: github.event_name != 'pull_request'
        env:
          ARKIV_ACCESS_KEY: ${{ secrets.ARKIV_ACCESS_KEY }}
        run: corepack pnpm@10.34.9 --filter @hexfence/arkiv exec tsx scripts/save-records.ts "$VITE_ARKIV_PUBLISHER" "$GITHUB_WORKSPACE/_site/evidence-saved.json"
      - name: Record SHA-256 of every published file
        shell: bash
        run: |
          (cd _site && find . -type f ! -name SHA256SUMS.txt ! -name .nojekyll -printf '%P\0' | sort -z | xargs -0 sha256sum) > SHA256SUMS.txt
          cp SHA256SUMS.txt _site/SHA256SUMS.txt
          wc -l SHA256SUMS.txt
      - name: Attest the published files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-checksums: SHA256SUMS.txt
      - name: Verify Pay build provenance
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh attestation verify _site/pay/index.html \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pages.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners --format json > pay-provenance.json
      - name: Keep provenance verification result
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pay-provenance
          path: pay-provenance.json
      - name: Keep the checksum list for the release record
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    # PRs build only. Manual runs on other branches cannot publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  release-record:
    # Writes hexfence.release.v1 to Arkiv after a deploy. Skips if the publisher secret is unset.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check publisher configuration
        id: config
        env:
          ARKIV_PRIVATE_KEY: ${{ secrets.ARKIV_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$ARKIV_PRIVATE_KEY" ]; then
            echo 'ARKIV_PRIVATE_KEY repository secret is missing; no release record written.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          name: sha256sums
      - name: Install and build
        if: steps.config.outputs.enabled == 'true'
        run: |
          corepack pnpm@10.34.9 install --frozen-lockfile
          corepack pnpm@10.34.9 --filter @hexfence/shared --filter @hexfence/arkiv build
      - name: Publish release record
        if: steps.config.outputs.enabled == 'true'
        env:
          ARKIV_PRIVATE_KEY: ${{ secrets.ARKIV_PRIVATE_KEY }}
          ARKIV_ACCESS_KEY: ${{ secrets.ARKIV_ACCESS_KEY }}
        run: corepack pnpm@10.34.9 --filter @hexfence/detector exec tsx src/publishRelease.ts "$GITHUB_WORKSPACE/SHA256SUMS.txt" "$GITHUB_SHA"
